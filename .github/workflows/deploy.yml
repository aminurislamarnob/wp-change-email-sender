name: Build and Release Plugin

on:
  push:
    tags:
      - "*"

jobs:
  buildAndRelease:
    name: Build Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build
        run: |
          composer install --no-dev --optimize-autoloader
          npm install
          npm run build

      - name: Create plugin zip
        run: |
          rsync -rc --exclude-from=.distignore ./ wp-change-email-sender/ --delete --delete-excluded
          zip -r wp-change-email-sender.zip wp-change-email-sender/
          rm -rf wp-change-email-sender

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-change-email-sender
          path: wp-change-email-sender.zip
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: wp-change-email-sender.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

